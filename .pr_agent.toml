[pr_reviewer]
require_security_review = true
require_tests_review = true
num_max_findings = 5

[github_app]
pr_commands = [
  "/describe --pr_description.publish_description_as_comment=true",
  "/review"
]
handle_push_trigger = true
push_commands = [
  "/review"
]
feedback_on_draft_pr = true

[review_agent]
enabled = true
publish_output = true
